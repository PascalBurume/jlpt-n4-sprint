<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N4Flow · JLPT N4 15-Day Sprint (Dec 6)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="furigana-on text-md">
    <div id="app-shell">
      <!-- Tier 1: Soft Royal-Violet Top Navigation Bar -->
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand" id="brand-home" role="button" tabindex="0" title="Back to Study Plan">
            <svg class="brand-logo" width="34" height="26" viewBox="0 0 36 26" fill="none" aria-hidden="true">
              <path
                d="M9.5 22.5H27.5C30.8137 22.5 33.5 19.8137 33.5 16.5C33.5 13.48 31.268 10.98 28.36 10.56C27.58 6.26 23.82 3 19.3 3C15.14 3 11.63 5.76 10.49 9.55C10.17 9.51 9.84 9.5 9.5 9.5C5.91015 9.5 3 12.4101 3 16C3 19.5899 5.91015 22.5 9.5 22.5Z"
                stroke="white"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <text x="18" y="18.2" text-anchor="middle" fill="white" font-size="9.5" font-weight="800" font-family="sans-serif">N4</text>
            </svg>
          </div>

          <nav class="nav-desktop" id="nav-desktop" aria-label="Primary"></nav>

          <div class="topbar-actions">
            <button class="btn-white-pill" id="btn-blitz-cta">
              <span class="plus-glyph">+</span>
              <span id="blitz-cta-label">Test éclair</span>
            </button>

            <button class="icon-bell-btn" id="btn-errors-bell" title="Error Notebook">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6v-5a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/>
              </svg>
              <span class="bell-badge hidden" id="bell-error-badge">0</span>
            </button>

            <button class="countdown-avatar" id="btn-golden-rule" title="La règle d'or / Golden Rule">
              <span class="avatar-circle" id="header-days-badge">★ J-15</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Tier 2: Crisp White Sub-Navigation & Study Controls Strip -->
      <div class="subbar">
        <div class="subbar-inner">
          <div class="subbar-tabs" id="subbar-tabs" role="tablist"></div>

          <div class="subbar-right">
            <!-- Text Size Control -->
            <div class="pill-group" id="textsize-toggle" role="group" aria-label="Text size" title="Text size">
              <button class="pill-seg" data-tsize="md">A</button>
              <button class="pill-seg" data-tsize="lg">A+</button>
              <button class="pill-seg" data-tsize="xl">A++</button>
            </div>

            <!-- Furigana Control -->
            <div class="pill-group" id="furigana-toggle" role="group" aria-label="Furigana" title="Furigana">
              <button class="pill-seg" data-furi="on">ふり</button>
              <button class="pill-seg" data-furi="hover">Hover</button>
              <button class="pill-seg" data-furi="off">OFF</button>
            </div>

            <!-- Language Control -->
            <div class="pill-group" id="lang-toggle" role="group" aria-label="Language" title="Language">
              <button class="pill-seg" data-lang="fr">FR</button>
              <button class="pill-seg" data-lang="both">FR+EN</button>
              <button class="pill-seg" data-lang="en">EN</button>
            </div>

            <!-- Search Pill + Instant Rule Guide Popover -->
            <div class="pill-search-wrap" id="global-search-wrap">
              <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20l-3.5-3.5"></path>
              </svg>
              <input
                type="search"
                id="global-search-input"
                class="pill-search-input"
                placeholder="Chercher une règle (たら, しか…)"
                autocomplete="off"
              />
              <div class="global-search-popover hidden" id="global-search-popover"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Workspace -->
      <main class="main-container" id="view-root"></main>

      <!-- Minimalist Footer -->
      <footer class="app-footer">
        <div class="app-footer-inner">
          <div class="footer-left">
            <svg width="24" height="18" viewBox="0 0 36 26" fill="none" aria-hidden="true">
              <path
                d="M9.5 22.5H27.5C30.8137 22.5 33.5 19.8137 33.5 16.5C33.5 13.48 31.268 10.98 28.36 10.56C27.58 6.26 23.82 3 19.3 3C15.14 3 11.63 5.76 10.49 9.55C10.17 9.51 9.84 9.5 9.5 9.5C5.91015 9.5 3 12.4101 3 16C3 19.5899 5.91015 22.5 9.5 22.5Z"
                stroke="#6D5BD0"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>JLPT N4 Express · 15-Day Sprint to December 6</span>
          </div>
          <div class="footer-links">
            <button class="footer-link-btn" id="footer-golden-btn">Règle d’or</button>
            <button class="footer-link-btn" id="footer-blitz-btn">Tests & Quiz</button>
            <button class="footer-link-btn" id="footer-radar-btn">Nom + ?</button>
            <button class="footer-link-btn" id="footer-errors-btn">Carnet d’erreurs</button>
          </div>
        </div>
      </footer>

      <!-- Mobile Bottom Bar -->
      <nav class="nav-mobile" id="nav-mobile" aria-label="Mobile navigation"></nav>
    </div>

    <!-- Modal Container -->
    <div class="modal-backdrop hidden" id="modal-backdrop" aria-hidden="true">
      <div class="modal-sheet" id="modal-sheet" role="dialog" aria-modal="true"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
